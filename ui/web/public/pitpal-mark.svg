<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>PitPal</title>
  <!-- The pit: an octagonal trading pit seen from above, outer rail and one step down. -->
  <path d="M11 4H21L28 11V21L21 28H11L4 21V11Z" stroke="#9399b2" stroke-width="1.75"/>
  <path d="M13.2 9.5H18.8L22.5 13.2V18.8L18.8 22.5H13.2L9.5 18.8V13.2Z" stroke="#585b70" stroke-width="1.25"/>
  <!-- Forecast cone: agent opinion, mauve, leaving the pit. -->
  <defs><linearGradient id="cone" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="29" y2="7.6"><stop offset="0" stop-color="#cba6f7" stop-opacity=".45"/><stop offset="1" stop-color="#cba6f7" stop-opacity="0"/></linearGradient></defs>
  <path d="M16 16L26.5 4L31 11.5Z" fill="url(#cone)"/>
  <!-- Observed price: solid. Forecast: dashed, and it breaks the rail. -->
  <path d="M4 21L8.5 17.5L11.5 19.5L16 16" stroke="#cdd6f4" stroke-width="2.25"/>
  <path d="M16 16L30 7" stroke="#cba6f7" stroke-width="2.25" stroke-dasharray="2.6 2.4"/>
  <circle cx="16" cy="16" r="2.4" fill="#cba6f7" stroke="#1e1e2e" stroke-width="1.4"/>
</svg>
